name: Linux Release Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"

      - name: Install dotslash
        run: |
          curl -fsSL -o /tmp/dotslash.tar.gz \
            https://github.com/facebook/dotslash/releases/download/v0.5.9/dotslash-ubuntu-22.04.x86_64.tar.gz
          tar -xzf /tmp/dotslash.tar.gz -C /tmp
          sudo install -m 0755 /tmp/dotslash /usr/local/bin/dotslash
          dotslash --version

      - name: Verify protoc
        run: |
          bin/protoc --version

      - name: Build release binary
        run: |
          cargo build -p xai-grok-pager-bin --release

      - name: Upload artifact (grok-linux-x64)
        uses: actions/upload-artifact@v4
        with:
          name: grok-linux-x64
          path: target/release/xai-grok-pager

      - name: Upload artifact (grok)
        uses: actions/upload-artifact@v4
        with:
          name: grok
          path: target/release/xai-grok-pager
