name: Linux Release Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"

      - name: Install dotslash
        run: |
          curl -L https://github.com/facebook/dotslash/releases/download/v0.4.1/dotslash-linux.v0.4.1.tar.gz | tar xz
          sudo mv dotslash /usr/local/bin/
          dotslash --version

      - name: Verify protoc
        run: |
          bin/protoc --version

      - name: Build release binary
        run: |
          cargo build -p xai-grok-pager-bin --release

      - name: Upload artifact (grok-linux-x64)
        uses: actions/upload-artifact@v4
        with:
          name: grok-linux-x64
          path: target/release/xai-grok-pager

      - name: Upload artifact (grok)
        uses: actions/upload-artifact@v4
        with:
          name: grok
          path: target/release/xai-grok-pager
